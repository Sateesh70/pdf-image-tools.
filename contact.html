<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - InstantFileTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="/" class="text-lg font-extrabold text-slate-900">InstantDoc<span class="text-indigo-600">Tools</span></a>
      <a href="/" class="text-xs font-semibold text-indigo-600 hover:underline">← Back to Tools</a>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-xl mx-auto px-6 py-12 flex-1 w-full bg-white my-8 rounded-2xl border border-slate-200 shadow-sm leading-relaxed text-sm space-y-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Contact Us</h1>
    <p class="text-slate-500 text-xs">Have a question, feedback, or need assistance? Reach out to our team.</p>

    <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-3">
      <p class="font-bold text-slate-800 text-sm">Direct Email Support:</p>
      <p class="text-indigo-600 font-mono text-sm select-all">support@instantfiletools.online</p>
      <p class="text-xs text-slate-400">We aim to respond to all inquiries within 24–48 business hours.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    © 2026 InstantFileTools. All rights reserved.
  </footer>
</body>
</html>
